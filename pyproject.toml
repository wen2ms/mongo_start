[project]
name = "mongo-start"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[all]>=0.143.1",
    "pymongo>=4.19.0",
    "python-dotenv>=1.2.4",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "E203",
  "E266",
  "E501",
  "D",
  "T201",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
